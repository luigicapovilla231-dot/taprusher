<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>TapRush</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #0b0a10;
    --panel: #15131c;
    --panel-edge: #262331;
    --ink: #f4f1ff;
    --muted: #7d7891;
    --pink: #ff3b81;
    --pink-glow: rgba(255, 59, 129, .45);
    --gold: #ffd43b;
    --red: #ff3030;
    --display: "Bungee", "Arial Black", sans-serif;
    --body: "Chakra Petch", "Trebuchet MS", sans-serif;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 15% 0%, rgba(255,59,129,.12), transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(255,212,59,.06), transparent 40%),
        var(--bg);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    user-select: none;
}

/* scanline overlay */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0 1px,
        transparent 1px 3px
    );
    z-index: 1000;
}

button {
    font-family: var(--display);
    border: none;
    padding: 16px 46px;
    border-radius: 14px;
    background: var(--pink);
    color: white;
    font-size: 20px;
    letter-spacing: .04em;
    box-shadow:
        0 6px 0 #b0124f,
        0 0 30px var(--pink-glow);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
}

button:hover {
    filter: brightness(1.08);
}

button:active {
    transform: translateY(4px);
    box-shadow:
        0 2px 0 #b0124f,
        0 0 20px var(--pink-glow);
}

button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
}

.ghostBtn {
    background: transparent;
    color: var(--muted);
    font-family: var(--body);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 10px 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    box-shadow: none;
}

.ghostBtn:hover {
    color: var(--ink);
    border-color: var(--muted);
}

.ghostBtn:active {
    transform: scale(.96);
    box-shadow: none;
}

/* =========================
   MENU
========================= */

#menu {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
}

#menu > * {
    animation: rise .6s cubic-bezier(.2,.9,.3,1.2) backwards;
}

#menu > *:nth-child(2) { animation-delay: .08s; }
#menu > *:nth-child(3) { animation-delay: .16s; }
#menu > *:nth-child(4) { animation-delay: .24s; }
#menu > *:nth-child(5) { animation-delay: .32s; }

@keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo {
    font-family: var(--display);
    font-size: clamp(48px, 12vw, 92px);
    line-height: .9;
    color: var(--pink);
    text-shadow:
        0 0 12px var(--pink),
        0 0 40px var(--pink-glow);
    rotate: -4deg;
    margin-bottom: 14px;
}

.logo em {
    font-style: normal;
    color: var(--ink);
    text-shadow: none;
    -webkit-text-stroke: 2px var(--pink);
    color: transparent;
}

.subtitle {
    color: var(--muted);
    letter-spacing: .3em;
    text-transform: uppercase;
    font-size: 13px;
    margin-bottom: 34px;
}

.recordCard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--panel-edge);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 34px;
    min-width: min(340px, 100%);
}

.recordCard > div {
    background: var(--panel);
    padding: 16px 22px;
    text-align: left;
}

.label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.recordCard b {
    font-family: var(--display);
    font-size: 30px;
    font-weight: normal;
    color: var(--gold);
}

.howTo {
    margin-top: 34px;
    display: flex;
    gap: 22px;
    color: var(--muted);
    font-size: 14px;
}

.howTo span {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 10px var(--pink);
}

.dot.bombDot {
    background: #050505;
    border: 3px solid var(--red);
    box-shadow: 0 0 10px var(--red);
}

/* =========================
   GAME LAYOUT
========================= */

#game {
    display: none;
    height: 100vh;
    height: 100dvh;
    padding: 16px;
    gap: 16px;
    grid-template-columns: 280px 1fr;
}

#game.active {
    display: grid;
}

/* =========================
   HUD PANEL (points, level, etc.)
========================= */

#hud {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 22px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
}

#hud::before {
    content: "";
    position: absolute;
    top: 0;
    left: 22px;
    right: 22px;
    height: 3px;
    background: var(--pink);
    box-shadow: 0 0 14px var(--pink);
    border-radius: 0 0 3px 3px;
}

.hudBrand {
    font-family: var(--display);
    color: var(--pink);
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.scoreBlock .value {
    font-family: var(--display);
    font-size: 56px;
    line-height: 1;
    display: block;
    font-variant-numeric: tabular-nums;
    transition: transform .12s;
}

.scoreBlock .value.bump {
    transform: scale(1.08);
    color: var(--gold);
}

.lastGain {
    color: var(--pink);
    font-weight: 700;
    font-size: 15px;
    height: 20px;
    opacity: 0;
}

.lastGain.show {
    animation: gainFade .7s ease-out;
}

@keyframes gainFade {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
}

.meter {
    height: 10px;
    background: #0c0b11;
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
}

.meter > div {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width .25s ease-out;
}

#levelBar {
    background: linear-gradient(90deg, var(--pink), var(--gold));
}

#timeBar {
    background: var(--ink);
    transition: width 1s linear, background .3s;
}

#timeBar.low {
    background: var(--red);
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.row .big {
    font-family: var(--display);
    font-size: 26px;
    font-variant-numeric: tabular-nums;
}

.small {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
}

.statGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.chip {
    background: #0f0e15;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 12px 14px;
}

.chip .big {
    font-family: var(--display);
    font-size: 24px;
    display: block;
}

#comboChip.hot {
    border-color: var(--pink);
    box-shadow: inset 0 0 18px rgba(255,59,129,.25);
}

#comboChip.hot .big {
    color: var(--pink);
}

.hudFooter {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
}

.hudFooter b {
    color: var(--gold);
    font-family: var(--display);
    font-weight: normal;
    font-size: 16px;
}

/* =========================
   ARENA (the playfield)
========================= */

#arena {
    position: relative;
    border-radius: 22px;
    border: 1px solid var(--panel-edge);
    overflow: hidden;
    background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 40px 40px,
        radial-gradient(ellipse at center, #17141f 0%, #0a0910 80%);
    box-shadow: inset 0 0 80px rgba(0,0,0,.6);
    touch-action: manipulation;
}

#arena.shake {
    animation: shake .35s;
}

@keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 4px); }
    40% { transform: translate(7px, -5px); }
    60% { transform: translate(-5px, -3px); }
    80% { transform: translate(4px, 3px); }
}

.corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: rgba(255,59,129,.5);
    border-style: solid;
    pointer-events: none;
}

.corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
.corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
.corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

/* TARGET */

#target {
    position: absolute;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8db6, var(--pink) 55%, #c4135a);
    box-shadow: 0 0 25px var(--pink);
    z-index: 5;
    transform: scale(1);
    transition:
        left .09s,
        top .09s,
        width .15s,
        height .15s,
        transform .1s;
    cursor: pointer;
}

#target:active {
    transform: scale(.8);
}

/* BOMB */

#target.bomb {
    background: #050505;
    border: 6px solid transparent;

    background-image:
        linear-gradient(#050505,#050505),
        conic-gradient(
            var(--red) var(--fuse),
            #555 var(--fuse)
        );

    background-origin: border-box;

    background-clip:
        padding-box,
        border-box;

    box-shadow:
        0 0 15px #ff2222,
        inset 0 0 15px #000;
}

/* PARTICLES */

.particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pink);
    pointer-events: none;
    z-index: 50;
}

/* SCORE POP */

.scorePop {
    position: absolute;
    color: white;
    font-family: var(--display);
    font-size: 30px;
    pointer-events: none;
    z-index: 60;
    animation: scorePop 1.2s forwards;
}

@keyframes scorePop {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-45px) scale(1.2);
        opacity: 0;
    }
}

/* LEVEL UP */

#levelUp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.5);
    opacity: 0;
    color: var(--gold);
    font-family: var(--display);
    font-size: clamp(30px, 6vw, 56px);
    text-shadow: 0 0 20px var(--gold);
    z-index: 4;
    pointer-events: none;
    white-space: nowrap;
}

.levelAnimation {
    animation: levelAnimation 1s ease-out;
}

@keyframes levelAnimation {
    0% {
        transform: translate(-50%, -50%) scale(.5);
        opacity: 0;
    }
    30% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: .9;
    }
    70% {
        transform: translate(-50%, -50%) scale(1);
        opacity: .9;
    }
    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
    }
}

/* GAME OVER */

#gameOver {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(8,7,12,.88);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
    z-index: 100;
}

#gameOver.show {
    display: flex;
    animation: rise .4s ease-out;
}

#gameOver h1 {
    font-family: var(--display);
    font-weight: normal;
    font-size: clamp(38px, 8vw, 64px);
    color: var(--pink);
    text-shadow: 0 0 24px var(--pink-glow);
    margin: 0 0 6px;
}

#gameOver p {
    color: var(--muted);
    margin: 0 0 26px;
}

.newBest {
    display: none;
    font-family: var(--display);
    color: var(--gold);
    font-size: 14px;
    letter-spacing: .1em;
    margin-bottom: 14px;
    animation: pulse 1s infinite alternate;
}

.newBest.show {
    display: block;
}

@keyframes pulse {
    from { opacity: .6; }
    to { opacity: 1; }
}

.finalStats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 30px;
    min-width: min(380px, 100%);
}

.finalStats .chip b {
    display: block;
    font-family: var(--display);
    font-weight: normal;
    font-size: 26px;
}

.overActions {
    display: flex;
    gap: 12px;
    align-items: center;
}


/* =========================
   ONLINE LEADERBOARD
========================= */

.boardBtn {
    margin-top: 16px;
}

#submitScore {
    display: none;
    gap: 8px;
    margin-bottom: 22px;
    width: min(380px, 100%);
}

#submitScore.show {
    display: flex;
}

#submitScore input {
    flex: 1;
    min-width: 0;
    font-family: var(--body);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 12px 14px;
    user-select: text;
}

#submitScore input:focus {
    outline: none;
    border-color: var(--pink);
}

#submitScore button {
    padding: 12px 18px;
    font-size: 14px;
    box-shadow: 0 4px 0 #b0124f;
}

#submitScore button:disabled {
    opacity: .5;
    cursor: default;
}

.submitStatus {
    min-height: 18px;
    margin: -12px 0 18px;
    font-size: 14px;
    color: var(--gold);
}

#leaderboard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(8,7,12,.92);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
}

#leaderboard.show {
    display: flex;
    animation: rise .35s ease-out;
}

.boardPanel {
    width: min(440px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    overflow: hidden;
}

.boardHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--panel-edge);
}

.boardHead h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: normal;
    font-size: 24px;
    color: var(--pink);
    text-shadow: 0 0 16px var(--pink-glow);
}

#boardList {
    list-style: none;
    margin: 0;
    padding: 6px 0;
    overflow-y: auto;
}

#boardList li {
    display: grid;
    grid-template-columns: 34px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 9px 20px;
}

#boardList li.mine {
    background: rgba(255,59,129,.12);
}

#boardList .rank {
    font-family: var(--display);
    color: var(--muted);
}

#boardList li:nth-child(1) .rank { color: var(--gold); }
#boardList li:nth-child(2) .rank { color: #d8d4e8; }
#boardList li:nth-child(3) .rank { color: #e08a4a; }

#boardList .who {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#boardList .lvl {
    color: var(--muted);
    font-size: 13px;
}

#boardList .pts {
    font-family: var(--display);
    color: var(--gold);
    min-width: 60px;
    text-align: right;
}

#boardList .empty {
    display: block;
    text-align: center;
    color: var(--muted);
    padding: 26px 20px;
}

/* =========================
   MOBILE: HUD on top, arena below
========================= */

@media (max-width: 760px) {

    #game {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        padding: 10px;
        gap: 10px;
    }

    #hud {
        padding: 14px 14px 12px;
        gap: 10px;
        border-radius: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-areas:
            "score score quit"
            "level level level"
            "combo time time";
        align-items: center;
    }

    .hudBrand { grid-area: quit; justify-content: flex-end; }
    .hudBrand .brandName { display: none; }
    .scoreBlock { grid-area: score; }
    .levelBlock { grid-area: level; }
    .statGrid { display: contents; }
    #comboChip { grid-area: combo; padding: 8px 10px; }
    #timeChip { grid-area: time; padding: 8px 10px; }
    .hudFooter, .lastGain, .small { display: none; }

    .scoreBlock .value { font-size: 34px; }
    .chip .big { font-size: 18px; }
    .row .big { font-size: 18px; }
    .meter { margin-top: 4px; height: 8px; }

    #arena { border-radius: 18px; }

    .howTo { flex-direction: column; gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <div class="logo">Tap<em>Rush</em></div>

    <div class="subtitle">How far can you get?</div>

    <div class="recordCard">
        <div>
            <span class="label">Best score</span>
            <b id="bestScore">0</b>
        </div>
        <div>
            <span class="label">Highest level</span>
            <b id="bestLevel">1</b>
        </div>
    </div>

    <button type="button" onclick="startGame()">START</button>

    <button type="button" class="ghostBtn boardBtn" onclick="openLeaderboard()">🏆 Leaderboard</button>

    <div class="howTo">
        <span><i class="dot"></i> Tap for points</span>
        <span><i class="dot bombDot"></i> Never tap bombs</span>
    </div>

</div>


<!-- GAME -->

<div id="game">

    <!-- HUD: everything about points lives here -->

    <aside id="hud">

        <div class="hudBrand">
            <span class="brandName">TapRush</span>
            <button type="button" class="ghostBtn" onclick="quitGame()">Quit</button>
        </div>

        <div class="scoreBlock">
            <span class="label">Score</span>
            <span class="value" id="score">0</span>
            <div class="lastGain" id="lastGain">+0</div>
        </div>

        <div class="levelBlock">
            <div class="row">
                <span class="label">Level</span>
                <span class="big" id="level">1</span>
            </div>
            <div class="meter"><div id="levelBar"></div></div>
            <div class="small" id="levelHint">0 pts to next level</div>
        </div>

        <div class="statGrid">
            <div class="chip" id="comboChip">
                <span class="label">Combo</span>
                <span class="big"><span id="combo">0</span>×</span>
            </div>
            <div class="chip" id="timeChip">
                <span class="label">Time</span>
                <span class="big"><span id="time">30</span>s</span>
                <div class="meter"><div id="timeBar"></div></div>
            </div>
        </div>

        <div class="hudFooter">
            <span>Personal best</span>
            <b id="hudBest">0</b>
        </div>

    </aside>


    <!-- ARENA: the game itself -->

    <main id="arena">

        <i class="corner tl"></i>
        <i class="corner tr"></i>
        <i class="corner bl"></i>
        <i class="corner br"></i>

        <div id="levelUp">LEVEL UP!</div>

        <div id="target"></div>

        <div id="gameOver">

            <h1 id="gameOverTitle">GAME OVER</h1>

            <p id="gameOverReason"></p>

            <div class="newBest" id="newBest">★ NEW BEST ★</div>

            <div class="finalStats">
                <div class="chip">
                    <span class="label">Score</span>
                    <b id="finalScore">0</b>
                </div>
                <div class="chip">
                    <span class="label">Level</span>
                    <b id="finalLevel">1</b>
                </div>
                <div class="chip">
                    <span class="label">Best</span>
                    <b id="finalBest">0</b>
                </div>
            </div>

            <form id="submitScore" onsubmit="submitScore(event)">
                <input id="playerName" type="text" maxlength="16" placeholder="Your name" autocomplete="nickname" required>
                <button type="submit" id="submitBtn">SUBMIT</button>
            </form>

            <div class="submitStatus" id="submitStatus"></div>

            <div class="overActions">
                <button type="button" onclick="startGame()">PLAY AGAIN</button>
                <button type="button" class="ghostBtn" onclick="openLeaderboard()">Ranks</button>
                <button type="button" class="ghostBtn" onclick="quitGame()">Menu</button>
            </div>

        </div>

    </main>

</div>


<!-- ONLINE LEADERBOARD -->

<div id="leaderboard" onclick="if (event.target === this) closeLeaderboard()">
    <div class="boardPanel" role="dialog" aria-labelledby="boardTitle">
        <div class="boardHead">
            <h2 id="boardTitle">TOP 20</h2>
            <button type="button" class="ghostBtn" onclick="closeLeaderboard()">Close</button>
        </div>
        <ol id="boardList"></ol>
    </div>
</div>


<script>

/* =========================
   ELEMENTS
========================= */

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const arena = document.getElementById("arena");
const target = document.getElementById("target");

const scoreText = document.getElementById("score");
const lastGain = document.getElementById("lastGain");
const comboText = document.getElementById("combo");
const comboChip = document.getElementById("comboChip");
const levelText = document.getElementById("level");
const levelBar = document.getElementById("levelBar");
const levelHint = document.getElementById("levelHint");
const timeText = document.getElementById("time");
const timeBar = document.getElementById("timeBar");
const hudBest = document.getElementById("hudBest");

const bestScoreText = document.getElementById("bestScore");
const bestLevelText = document.getElementById("bestLevel");

const gameOver = document.getElementById("gameOver");
const gameOverTitle = document.getElementById("gameOverTitle");
const gameOverReason = document.getElementById("gameOverReason");
const newBest = document.getElementById("newBest");

const finalScore = document.getElementById("finalScore");
const finalLevel = document.getElementById("finalLevel");
const finalBest = document.getElementById("finalBest");

const levelUp = document.getElementById("levelUp");


/* =========================
   VARIABLES
========================= */

const ROUND_TIME = 30;

let score = 0;
let combo = 0;
let level = 1;
let time = ROUND_TIME;

let gameRunning = false;

let gameTimer = null;
let bombTimer = null;
let targetTimer = null;

let targetIsBomb = false;


/* =========================
   HIGH SCORES
========================= */

let bestScore =
    Number(localStorage.getItem("taprushBestScore")) || 0;

let bestLevel =
    Number(localStorage.getItem("taprushBestLevel")) || 1;

bestScoreText.textContent = bestScore;
bestLevelText.textContent = bestLevel;


/* =========================
   AUDIO
========================= */

let audioContext = null;

function initAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioContext) {
            audioContext = new AudioContext();
        }
    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {
        audioContext.resume();
    }
}


function clickSound() {

    initAudio();

    if (!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(500, audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(850, audioContext.currentTime + .05);

    gain.gain.setValueAtTime(.07, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .06);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .06);
}


/* =========================
   LEVEL REQUIREMENTS
========================= */

function pointsForLevel(lvl) {

    if (lvl <= 1) return 0;

    const n = lvl - 1;

    return Math.floor(
        120 +
        (n - 1) * 80 +
        Math.pow(n - 1, 2) * 20
    );
}


/* =========================
   DIFFICULTY
========================= */

function difficulty() {

    const size = Math.max(34, 68 - (level - 1) * 2);
    const bombChance = Math.min(.10 + (level - 1) * .017, .38);
    const targetLifetime = Math.max(650, 1800 - (level - 1) * 60);
    const fuse = Math.max(650, 1500 - (level - 1) * 45);

    return { size, bombChance, targetLifetime, fuse };
}


/* =========================
   HUD UPDATES
========================= */

function updateHud() {

    scoreText.textContent = score;
    comboText.textContent = combo;
    levelText.textContent = level;
    timeText.textContent = time;
    hudBest.textContent = Math.max(bestScore, score);

    comboChip.classList.toggle("hot", combo >= 5);

    const from = pointsForLevel(level);
    const to = pointsForLevel(level + 1);
    const progress = Math.min(1, (score - from) / (to - from));

    levelBar.style.width = (progress * 100) + "%";
    levelHint.textContent = Math.max(0, to - score) + " pts to level " + (level + 1);

    timeBar.style.width = (time / ROUND_TIME * 100) + "%";
    timeBar.classList.toggle("low", time <= 5);
}


function showGain(points) {

    lastGain.textContent = "+" + points;
    lastGain.classList.remove("show");
    void lastGain.offsetWidth;
    lastGain.classList.add("show");

    scoreText.classList.add("bump");
    setTimeout(() => scoreText.classList.remove("bump"), 120);
}


/* =========================
   START / QUIT
========================= */

function stopTimers() {

    clearInterval(gameTimer);
    clearTimeout(bombTimer);
    clearTimeout(targetTimer);
}


function startGame() {

    initAudio();
    stopTimers();

    score = 0;
    combo = 0;
    level = 1;
    time = ROUND_TIME;

    gameRunning = true;
    targetIsBomb = false;

    menu.style.display = "none";
    game.classList.add("active");

    gameOver.classList.remove("show");
    target.style.display = "block";
    target.classList.remove("bomb");

    updateHud();

    gameTimer = setInterval(() => {

        if (!gameRunning) return;

        time--;

        updateHud();

        if (time <= 0) {
            endGame("TIME'S UP!", "You survived the round.");
        }

    }, 1000);

    // wait one frame so the arena has its size before placing the target
    requestAnimationFrame(moveTarget);
}


function quitGame() {

    gameRunning = false;
    stopTimers();

    game.classList.remove("active");
    gameOver.classList.remove("show");
    menu.style.display = "flex";
}


/* =========================
   MOVE TARGET
========================= */

function moveTarget() {

    if (!gameRunning) return;

    clearTimeout(bombTimer);
    clearTimeout(targetTimer);

    targetIsBomb = false;
    target.classList.remove("bomb");

    const diff = difficulty();

    target.style.width = diff.size + "px";
    target.style.height = diff.size + "px";

    randomPosition(diff.size);

    if (Math.random() < diff.bombChance) {
        spawnBomb(diff.fuse);
    } else {
        spawnNormalTarget(diff.targetLifetime);
    }
}


/* =========================
   NORMAL TARGET
========================= */

function spawnNormalTarget(lifetime) {

    targetIsBomb = false;
    target.classList.remove("bomb");

    targetTimer = setTimeout(() => {

        if (!gameRunning) return;

        combo = 0;
        updateHud();

        moveTarget();

    }, lifetime);
}


/* =========================
   BOMB
========================= */

function spawnBomb(fuseTime) {

    targetIsBomb = true;

    target.classList.add("bomb");
    target.style.setProperty("--fuse", "100%");

    const startTime = Date.now();

    function animateFuse() {

        if (!gameRunning || !targetIsBomb) return;

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 1 - elapsed / fuseTime);

        target.style.setProperty("--fuse", (remaining * 100) + "%");

        if (remaining > 0) {
            requestAnimationFrame(animateFuse);
        }
    }

    animateFuse();

    bombTimer = setTimeout(() => {

        if (!gameRunning) return;

        targetIsBomb = false;
        target.classList.remove("bomb");

        moveTarget();

    }, fuseTime);
}


/* =========================
   RANDOM POSITION (inside the arena)
========================= */

function randomPosition(size = target.offsetWidth) {

    const pad = 16;

    const maxX = Math.max(0, arena.clientWidth - size - pad * 2);
    const maxY = Math.max(0, arena.clientHeight - size - pad * 2);

    target.style.left = (pad + Math.random() * maxX) + "px";
    target.style.top = (pad + Math.random() * maxY) + "px";
}


/* =========================
   TARGET CLICK
========================= */

target.addEventListener("click", () => {

    if (!gameRunning) return;


    /* BOMB */

    if (targetIsBomb) {

        bombExplosion();

        endGame("BOOM!", "You tapped a bomb!");

        return;
    }


    /* NORMAL TARGET */

    clickSound();

    clearTimeout(targetTimer);

    combo++;

    const comboBonus = Math.min(combo, 20);
    const points = 10 + comboBonus * 2;

    score += points;

    createParticles();
    createScorePop("+" + points);
    showGain(points);


    /* LEVEL */

    const nextLevel = level + 1;

    if (score >= pointsForLevel(nextLevel)) {

        level = nextLevel;

        showLevelUp();
    }

    updateHud();


    /* CLICK ANIMATION */

    target.style.transform = "scale(1.18)";

    setTimeout(() => {
        if (gameRunning) target.style.transform = "scale(1)";
    }, 100);


    /* NEXT TARGET */

    setTimeout(() => {
        if (gameRunning) moveTarget();
    }, 70);

});


/* =========================
   PARTICLES
========================= */

function targetCenter() {

    return {
        x: target.offsetLeft + target.offsetWidth / 2,
        y: target.offsetTop + target.offsetHeight / 2
    };
}


function createParticles() {

    const { x, y } = targetCenter();

    for (let i = 0; i < 10; i++) {

        const particle = document.createElement("div");

        particle.className = "particle";
        particle.style.left = x + "px";
        particle.style.top = y + "px";

        arena.appendChild(particle);

        const angle = Math.random() * Math.PI * 2;
        const distance = 20 + Math.random() * 45;

        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        particle.animate(
            [
                { transform: "translate(0,0)", opacity: 1 },
                { transform: `translate(${dx}px,${dy}px)`, opacity: 0 }
            ],
            { duration: 400, easing: "ease-out" }
        );

        setTimeout(() => particle.remove(), 400);
    }
}


/* =========================
   SCORE POP
========================= */

function createScorePop(text) {

    const pop = document.createElement("div");

    pop.className = "scorePop";
    pop.textContent = text;
    pop.style.left = target.offsetLeft + "px";
    pop.style.top = target.offsetTop + "px";

    arena.appendChild(pop);

    setTimeout(() => pop.remove(), 1000);
}


/* =========================
   LEVEL UP
========================= */

function showLevelUp() {

    levelUp.classList.remove("levelAnimation");

    void levelUp.offsetWidth;

    levelUp.textContent = "LEVEL " + level + "!";

    levelUp.classList.add("levelAnimation");
}


/* =========================
   BOMB EXPLOSION
========================= */

function bombExplosion() {

    target.style.transform = "scale(1.35)";
    target.style.boxShadow = "0 0 60px #ff0000";

    arena.classList.remove("shake");
    void arena.offsetWidth;
    arena.classList.add("shake");

    setTimeout(() => {
        target.style.transform = "scale(1)";
        target.style.boxShadow = "";
    }, 250);
}


/* =========================
   GAME OVER
========================= */

function endGame(title, reason) {

    if (!gameRunning) return;

    gameRunning = false;

    stopTimers();

    targetIsBomb = false;

    target.style.display = "none";

    gameOverTitle.textContent = title;
    gameOverReason.textContent = reason;

    finalScore.textContent = score;
    finalLevel.textContent = level;

    newBest.classList.toggle("show", score > bestScore && score > 0);


    /* SAVE BEST SCORE */

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem("taprushBestScore", bestScore);
    }


    /* SAVE BEST LEVEL */

    if (level > bestLevel) {

        bestLevel = level;

        localStorage.setItem("taprushBestLevel", bestLevel);
    }


    bestScoreText.textContent = bestScore;
    bestLevelText.textContent = bestLevel;
    finalBest.textContent = bestScore;
    hudBest.textContent = bestScore;

    showSubmitForm();

    gameOver.classList.add("show");
}


/* =========================
   ONLINE LEADERBOARD
========================= */

const leaderboard = document.getElementById("leaderboard");
const boardList = document.getElementById("boardList");
const submitForm = document.getElementById("submitScore");
const playerName = document.getElementById("playerName");
const submitBtn = document.getElementById("submitBtn");
const submitStatus = document.getElementById("submitStatus");

let lastSubmittedId = null;

playerName.value = localStorage.getItem("taprushName") || "";

function renderBoard(entries) {

    boardList.innerHTML = "";

    if (!entries.length) {
        boardList.innerHTML = '<li class="empty">No scores yet. Be the first!</li>';
        return;
    }

    entries.forEach((entry, i) => {

        const li = document.createElement("li");
        if (entry.id === lastSubmittedId) li.classList.add("mine");

        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = i + 1;

        const who = document.createElement("span");
        who.className = "who";
        who.textContent = entry.name;

        const lvl = document.createElement("span");
        lvl.className = "lvl";
        lvl.textContent = "Lv " + entry.level;

        const pts = document.createElement("span");
        pts.className = "pts";
        pts.textContent = entry.score;

        li.append(rank, who, lvl, pts);
        boardList.appendChild(li);
    });
}

async function openLeaderboard() {

    leaderboard.classList.add("show");
    boardList.innerHTML = '<li class="empty">Loading…</li>';

    try {
        const res = await fetch("/api/scores");
        if (!res.ok) throw new Error();
        renderBoard(await res.json());
    } catch {
        boardList.innerHTML = '<li class="empty">Could not load the leaderboard.</li>';
    }
}

function closeLeaderboard() {

    leaderboard.classList.remove("show");
}

function showSubmitForm() {

    submitStatus.textContent = "";
    submitBtn.disabled = false;
    submitForm.classList.toggle("show", score > 0);
}

async function submitScore(event) {

    event.preventDefault();

    const name = playerName.value.trim();
    if (!name) return;

    localStorage.setItem("taprushName", name);

    submitBtn.disabled = true;
    submitStatus.textContent = "Submitting…";

    try {
        const res = await fetch("/api/scores", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, score, level })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");

        lastSubmittedId = data.id;
        submitForm.classList.remove("show");

        const rank = data.top.findIndex(e => e.id === data.id);
        submitStatus.textContent = rank >= 0
            ? "You're #" + (rank + 1) + " on the leaderboard!"
            : "Score submitted!";

    } catch (err) {
        submitBtn.disabled = false;
        submitStatus.textContent = "Could not submit score. Try again.";
    }
}

document.addEventListener("keydown", e => {

    if (e.key === "Escape") closeLeaderboard();
});


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

    if (gameRunning) randomPosition();
});

</script>

</body>
</html>
